# project-scoped codex config (trust this project in codex to load it)
[mcp_servers.mongodb]
command = "sh"
args = ["scripts/mcp-mongodb.sh"]

[mcp_servers.mongo-hive]
command = "npx"
args = ["tsx", "--env-file=.env", "src/mcp/server.ts"]
env = { HIVE_HARNESS = "codex" }
env_vars = ["HIVE_USER", "HIVE_RUN_ID"]
